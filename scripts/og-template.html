<!DOCTYPE html>
<!-- Rendered to assets/img/og-image.jpg (1200×630) by `npm run og`. Pulls name/stats/images from data.js. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#111;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(90px)}
  .g1{width:420px;height:420px;background:rgba(232,64,42,.35);left:-140px;top:-160px}
  .g2{width:380px;height:380px;background:rgba(232,64,42,.18);left:420px;bottom:-220px}
  .left{position:absolute;left:72px;top:64px;bottom:60px;width:560px;display:flex;flex-direction:column}
  .badge{display:flex;align-items:center;gap:14px}
  .mark{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:italic 34px 'Instrument Serif',serif}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:rgba(255,255,255,.8)}
  .dot{width:9px;height:9px;border-radius:50%;background:#22c55e}
  h1{margin-top:40px;font-size:84px;font-weight:800;letter-spacing:-.035em;line-height:.95}
  .role{margin-top:10px;font:italic 64px/1 'Instrument Serif',serif;color:#E8402A}
  .services{margin-top:28px;font-size:22px;font-weight:600;color:rgba(255,255,255,.7);line-height:1.45}
  .foot{margin-top:auto;display:flex;align-items:center;gap:18px;font-size:20px;font-weight:700}
  .foot .url{color:#fff}
  .foot .sep{width:6px;height:6px;border-radius:50%;background:#E8402A}
  .foot .stat{color:rgba(255,255,255,.6);font-weight:600}
  .collage{position:absolute;right:-30px;top:-40px;width:520px;height:720px;display:grid;grid-template-columns:1fr 1fr;gap:16px;transform:rotate(-6deg)}
  .col{display:flex;flex-direction:column;gap:16px}
  .col:nth-child(2){margin-top:-90px}
  .col img{width:100%;border-radius:22px;display:block;object-fit:cover;box-shadow:0 20px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="left">
    <div class="badge"><div class="mark" id="initials"></div><span class="pill"><span class="dot"></span><span id="status"></span></span></div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="services">Packaging · E-commerce banners<br>Social media creatives · Logos</div>
    <div class="foot"><span class="url" id="url"></span><span class="sep"></span><span class="stat" id="stat"></span></div>
  </div>
  <div class="collage"><div class="col" id="c1"></div><div class="col" id="c2"></div></div>

<script src="../assets/js/data.js"></script>
<script>
  const { SITE, PROFILE, BRANDS, projects } = window.PORTFOLIO;
  document.getElementById('initials').textContent = PROFILE.initials;
  document.getElementById('status').textContent = PROFILE.status;
  document.getElementById('name').textContent = PROFILE.name;
  document.getElementById('role').textContent = PROFILE.jobTitle;
  document.getElementById('url').textContent = SITE.url.replace(/^https?:\/\//, '');
  document.getElementById('stat').textContent = `${projects.length} designs · ${Object.keys(BRANDS).length} brands`;
  // A varied mix: square social posts, a bottle, a logo, pet packaging.
  const pick = [1, 3, 5, 2, 4, 10].map((i) => projects[i]).filter((p) => p && !p.wide);
  pick.forEach((p, i) => {
    const img = document.createElement('img');
    img.src = '../' + p.thumb;
    img.style.aspectRatio = `${p.w} / ${p.h}`;
    document.getElementById(i % 2 ? 'c2' : 'c1').appendChild(img);
  });
</script>
</body>
</html>
